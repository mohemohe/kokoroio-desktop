name: Build and Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build universal macOS app
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test --scratch-path .build/ci-tests --parallel

      - name: Build and package (ad-hoc signature)
        env:
          VERSION: 0.0.0
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-release.sh

      - name: Upload development build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KokoroDesktop-ci-${{ github.run_number }}
          path: |
            build/release/KokoroDesktop-*.zip
            build/release/KokoroDesktop-*.dmg
            build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
