name: Windows Build and Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.sha }}
      version: 0.0.0
      artifact-name: KokoroDesktop-windows-ci-${{ github.run_number }}
      retention-days: 7
